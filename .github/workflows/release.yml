name: Release

# Default-branch builds replace one rolling preview. Manual full releases use vX.X.X from
# the committed Source TOC. The manifest identifies the exact producing and Questie commits.
#
# Publication is impossible on red. `publish` needs both the artifact quality bar and the
# compiler differential. The write-enabled jobs run no build or test code: publication uploads
# only the artifacts handed through those gates, unmodified.
# GitHub publication uses the automatic GITHUB_TOKEN; no external publishing is configured.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish vX.X.X from QuestieDB.toc instead of updating preview"
        type: boolean
        default: false
      override:
        description: "Replace an existing full release's assets and move its tag to this commit"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: 1700000000
  QUESTIEDB_RELEASE: ${{ inputs.release && 'true' || 'false' }}
  RELEASE_OVERRIDE: ${{ inputs.override && 'true' || 'false' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    # Push access makes drafts visible. This job only reads GitHub state.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Choose release and reject existing versions
        id: release
        working-directory: QuestieDB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must run from the default branch."
            exit 1
          fi
          if [[ "$RELEASE_OVERRIDE" == true && "$QUESTIEDB_RELEASE" != true ]]; then
            echo "::error::override applies only to full releases."
            exit 1
          fi
          VERSION=$(lua5.1 -e 'print(dofile("generator/version.lua").read("QuestieDB.toc"))')
          TAG=preview
          if [[ "$QUESTIEDB_RELEASE" == true ]]; then TAG="v$VERSION"; fi

          # GraphQL includes drafts and distinguishes absence (null) from API/auth failures.
          # Its $variables must reach the API unexpanded.
          # shellcheck disable=SC2016
          STATE=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$TAG" -f ref="refs/tags/$TAG" -f query='
            query($owner:String!, $repo:String!, $tag:String!, $ref:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { databaseId } ref(qualifiedName:$ref) { name } }
            }' --jq '.data.repository')
          jq -e 'type == "object"' <<< "$STATE" > /dev/null
          if [[ "$QUESTIEDB_RELEASE" == true && "$RELEASE_OVERRIDE" != true ]] && \
             jq -e '.release != null or .ref != null' <<< "$STATE" > /dev/null; then
            echo "::error::$TAG already exists. Bump ## Version or explicitly enable override."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality bar
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      - uses: ./QuestieDB/.github/actions/checkout-questie

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generator tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/validation/version.test.py
          python3 tools/validation/localization-inputs.test.py
          python3 tools/questie-sync/questie-checkout.test.py

      - name: Tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/cli/questiedb.test.py
          python3 tools/distribution/package.test.py
          python3 tools/distribution/bootstrap.test.py

      - name: Materialize the schema
        working-directory: QuestieDB
        run: lua5.1 generate.lua meta ../Questie

      - name: Fail on schema drift
        working-directory: QuestieDB
        run: git diff --exit-code src/meta/

      - name: Fail on correction drift
        working-directory: QuestieDB
        run: |
          lua5.1 tools/questie-sync/port-corrections.lua ../Questie
          git diff --exit-code src/corrections/ src/derived/RamerDouglasPeucker.lua || {
            echo "::error::Ported Corrections or copied libraries differ from Questie's. Review and commit the re-port."
            exit 1
          }

      - name: Fail on Source TOC drift
        working-directory: QuestieDB
        run: |
          lua5.1 generate.lua toc
          git diff --exit-code QuestieDB.toc

      - name: Generate every flavor
        working-directory: QuestieDB
        run: lua5.1 generate.lua all

      - name: Determinism
        working-directory: QuestieDB
        # Regenerate before the read gates. The artifacts they approve are therefore the exact
        # second-generation bytes this check proved identical to the first generation.
        run: |
          sha256sum QuestieDB_{Vanilla,TBC,Wrath,Cata,Mists}.toc > first.sha
          lua5.1 generate.lua all --quiet
          sha256sum -c first.sha

      - name: Unit tests
        working-directory: QuestieDB
        # Defense in depth: the same suite CI runs, here against the artifacts being released.
        run: lua5.1 test.lua

      - name: Reconstruct every artifact
        working-directory: QuestieDB
        run: lua5.1 reconstruct.lua Vanilla TBC Wrath Cata Mists

      - name: Verify every flavor
        working-directory: QuestieDB
        run: lua5.1 verify.lua

      - name: Verify ownership under freezing
        working-directory: QuestieDB
        # Match CI's smallest/largest coverage without doubling every flavor's runtime.
        run: lua5.1 verify.lua Vanilla Mists --freeze

      - name: Source/baked equivalence
        working-directory: QuestieDB
        run: lua5.1 equivalence.lua

      - name: Validate every flavor
        working-directory: QuestieDB
        run: lua5.1 validators/run.lua

      - name: Golden composed reads
        working-directory: QuestieDB
        run: |
          for flavor in Vanilla TBC Wrath Cata Mists; do
            python3 tools/differential/golden.py check "$flavor" --lua=lua5.1 --self-check
          done

      - name: Package and write the manifest
        working-directory: QuestieDB
        run: ./questiedb.sh package all

      - name: Hand the packaged release to publish
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: QuestieDB/.out/dist/*
          retention-days: 7
          if-no-files-found: error

  differential:
    name: Compiler differential (${{ matrix.flavor }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists]
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      - uses: ./QuestieDB/.github/actions/checkout-questie

      # Questie's compiler oracle needs bit32. Keep this in its own job so the artifact job
      # can continue using the apt-installed interpreter used by the rest of the quality bar.
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v13.0.0
        with:
          luaVersion: "5.1"
      - name: Install luarocks
        uses: leafo/gh-actions-luarocks@v6.1.0
        with:
          luaRocksVersion: "3.13.0"
      - name: Install bit32
        run: luarocks install bit32 5.3.5.1-1

      - name: QuestieDB vs Questie's compiler
        working-directory: QuestieDB
        run: >-
          python3 tools/differential/compiler_diff.py ${{ matrix.flavor }}
          --questie=../Questie --lua=lua --self-check

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [quality, differential]
    # Serialize mutations, not builds. Never cancel an upload midway through replacement.
    # Builds can finish out of commit order, so the publisher also rejects stale previews.
    concurrency:
      # Keep the pre-rename lock so older workflow runs cannot publish concurrently.
      group: questietdb-release-publication
      cancel-in-progress: false
      # Retain pending manual releases instead of letting a preview evict them.
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: QuestieDB/.out/dist

      - name: Publish
        working-directory: QuestieDB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.quality.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]

          # Check the gated handoff before touching a tag or release. Require the exact ZIP set.
          jq -e --arg commit "$GITHUB_SHA" '
            .producerCommit == $commit and
            ([.artifacts[].file] | sort) == (["QuestieDB-Vanilla.zip", "QuestieDB-TBC.zip",
              "QuestieDB-Wrath.zip", "QuestieDB-Cata.zip", "QuestieDB-Mists.zip", "QuestieDB-all.zip"] | sort) and
            all(.artifacts[]; .sha256 | test("^[0-9a-f]{64}$"))
            ' .out/dist/release.json > /dev/null
          jq -r '.artifacts[] | "\(.sha256)  \(.file)"' .out/dist/release.json > .out/release.sha
          (cd .out/dist && sha256sum --strict -c ../release.sha)
          test -f .out/dist/RELEASE_NOTES.md

          # Repeat the collision check under the publication lock: preflight can go stale.
          # shellcheck disable=SC2016
          STATE=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$TAG" -f ref="refs/tags/$TAG" -f query='
            query($owner:String!, $repo:String!, $tag:String!, $ref:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { databaseId } ref(qualifiedName:$ref) { name } }
            }' --jq '.data.repository')
          jq -e 'type == "object"' <<< "$STATE" > /dev/null
          if [[ "$QUESTIEDB_RELEASE" == true && "$RELEASE_OVERRIDE" != true ]] && \
             jq -e '.release != null or .ref != null' <<< "$STATE" > /dev/null; then
            echo "::error::$TAG already exists. Bump ## Version or explicitly enable override."
            exit 1
          fi
          RELEASE_ID=$(jq -r '.release.databaseId // empty' <<< "$STATE")
          HAS_TAG=$(jq -r '.ref != null' <<< "$STATE")
          if [[ -n "$RELEASE_ID" ]]; then
            IMMUTABLE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.immutable // false')
            if [[ "$IMMUTABLE" == true ]]; then
              echo "::error::$TAG is immutable on GitHub; override cannot replace it."
              exit 1
            fi
          fi
          if [[ "$TAG" == preview && "$HAS_TAG" == true ]]; then
            CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq '.sha')
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$CURRENT...$GITHUB_SHA" --jq '.status')
            case "$STATUS" in
              behind) echo "A newer preview is already published; skipping this build."; exit 0 ;;
              ahead|identical) ;;
              *) echo "::error::Preview history diverged. Resolve its tag before publishing."; exit 1 ;;
            esac
          fi

          TITLE="Development preview"
          PRERELEASE=true
          if [[ "$QUESTIEDB_RELEASE" == true ]]; then TITLE="QuestieDB ${TAG#v}"; PRERELEASE=false; fi
          if [[ "$HAS_TAG" == false ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
          if [[ -z "$RELEASE_ID" ]]; then
            # Only first publication uses a draft, so a failed first upload stays unpublished.
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --draft \
              --title "$TITLE" --notes-file .out/dist/RELEASE_NOTES.md
          fi

          # Updates are intentionally non-atomic. Keep the old manifest until all ZIPs upload;
          # bootstrap rejects mixed downloads. Rerun after failure (full releases need override).
          gh release upload "$TAG" .out/dist/QuestieDB-{Vanilla,TBC,Wrath,Cata,Mists,all}.zip \
            .out/dist/RELEASE_NOTES.md --clobber
          if [[ "$HAS_TAG" == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --method PATCH -f sha="$GITHUB_SHA" -F force=true
          fi
          gh release upload "$TAG" .out/dist/release.json --clobber
          gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file .out/dist/RELEASE_NOTES.md --prerelease="$PRERELEASE" --latest="$QUESTIEDB_RELEASE"
