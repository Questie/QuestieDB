name: Release

# Default-branch builds replace one rolling preview. Manual full releases use vX.X.X from
# the committed Source TOC and default to a dry run. Pushes still publish preview automatically.
# The manifest identifies the exact producing and Questie commits.
#
# Publication is impossible on red. `publish` needs both the artifact quality bar and the
# compiler differential. The write-enabled jobs run no build or test code: publication uploads
# only the artifacts handed through those gates, unmodified.
# GitHub publication uses the automatic GITHUB_TOKEN; no external publishing is configured.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and preview the release without changing tags or GitHub releases"
        type: boolean
        default: true
      release:
        description: "Build vX.X.X from QuestieDB.toc instead of a development preview"
        type: boolean
        default: false
      override:
        description: "Replace an existing full release's assets and move its tag to this commit"
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: 1700000000
  QUESTIEDB_RELEASE: ${{ inputs.release && 'true' || 'false' }}
  RELEASE_OVERRIDE: ${{ inputs.override && 'true' || 'false' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    # Push access makes drafts visible. This job only reads GitHub state.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Choose release and reject existing versions
        id: release
        working-directory: QuestieDB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Releases must run from the default branch."
            exit 1
          fi
          if [[ "$RELEASE_OVERRIDE" == true && "$QUESTIEDB_RELEASE" != true ]]; then
            echo "::error::override applies only to full releases."
            exit 1
          fi
          VERSION=$(lua5.1 -e 'print(dofile("generator/version.lua").read("QuestieDB.toc"))')
          TAG=preview
          if [[ "$QUESTIEDB_RELEASE" == true ]]; then TAG="v$VERSION"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Rehearsals may inspect an existing version; no publication state is needed.
          if [[ "$DRY_RUN" == true ]]; then
            echo "Dry run: building $TAG without changing tags or releases."
            exit 0
          fi

          # GraphQL includes drafts and distinguishes absence (null) from API/auth failures.
          # Its $variables must reach the API unexpanded.
          # shellcheck disable=SC2016
          STATE=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$TAG" -f ref="refs/tags/$TAG" -f query='
            query($owner:String!, $repo:String!, $tag:String!, $ref:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { databaseId } ref(qualifiedName:$ref) { name } }
            }' --jq '.data.repository')
          jq -e 'type == "object"' <<< "$STATE" > /dev/null
          if [[ "$QUESTIEDB_RELEASE" == true && "$RELEASE_OVERRIDE" != true ]] && \
             jq -e '.release != null or .ref != null' <<< "$STATE" > /dev/null; then
            echo "::error::$TAG already exists. Bump ## Version or explicitly enable override."
            exit 1
          fi

  shared:
    name: Shared checks
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      - uses: ./QuestieDB/.github/actions/checkout-questie

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generator tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/validation/version.test.py
          python3 tools/validation/localization-inputs.test.py
          python3 tools/questie-sync/questie-checkout.test.py

      - name: Tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/cli/questiedb.test.py
          python3 tools/validation/test-scopes.test.py
          python3 tools/distribution/package.test.py
          python3 tools/distribution/bootstrap.test.py
          python3 tools/distribution/release_artifacts.test.py

      - name: Materialize the schema
        working-directory: QuestieDB
        run: lua5.1 generate.lua meta ../Questie

      - name: Fail on schema drift
        working-directory: QuestieDB
        run: git diff --exit-code src/meta/

      - name: Fail on correction drift
        working-directory: QuestieDB
        run: |
          lua5.1 tools/questie-sync/port-corrections.lua ../Questie
          git diff --exit-code src/corrections/ src/derived/RamerDouglasPeucker.lua || {
            echo "::error::Ported Corrections or copied libraries differ from Questie's. Review and commit the re-port."
            exit 1
          }

      - name: Fail on Source TOC drift
        working-directory: QuestieDB
        run: |
          lua5.1 generate.lua toc
          git diff --exit-code QuestieDB.toc

      - name: Shared unit tests
        working-directory: QuestieDB
        run: lua5.1 test.lua --shared

  database:
    name: Quality bar (${{ matrix.flavor }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists]
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      # Flavor tests compare ObjectiveFirst and Titan behavior against the pinned oracle.
      - uses: ./QuestieDB/.github/actions/checkout-questie

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generate
        working-directory: QuestieDB
        run: lua5.1 generate.lua ${{ matrix.flavor }}

      - name: Determinism
        working-directory: QuestieDB
        # Every read gate approves the second-generation bytes whose hash matched the first.
        # Keep a distinct checksum file per flavor for the packaging handoff.
        run: |
          sha256sum QuestieDB_${{ matrix.flavor }}.toc > QuestieDB_${{ matrix.flavor }}.sha256
          lua5.1 generate.lua ${{ matrix.flavor }} --quiet
          sha256sum -c QuestieDB_${{ matrix.flavor }}.sha256

      - name: Flavor unit tests
        working-directory: QuestieDB
        run: lua5.1 test.lua --flavor=${{ matrix.flavor }}

      - name: Reconstruct artifact
        working-directory: QuestieDB
        run: lua5.1 reconstruct.lua ${{ matrix.flavor }}

      - name: Verify artifact
        working-directory: QuestieDB
        run: lua5.1 verify.lua ${{ matrix.flavor }}

      - name: Verify ownership under freezing
        working-directory: QuestieDB
        # Match CI's smallest/largest coverage without doubling every flavor's runtime.
        if: matrix.flavor == 'Vanilla' || matrix.flavor == 'Mists'
        run: lua5.1 verify.lua ${{ matrix.flavor }} --freeze

      - name: Source/baked equivalence
        working-directory: QuestieDB
        run: lua5.1 equivalence.lua ${{ matrix.flavor }}

      - name: Data validators
        working-directory: QuestieDB
        run: lua5.1 validators/run.lua ${{ matrix.flavor }}

      - name: Golden composed reads
        working-directory: QuestieDB
        run: python3 tools/differential/golden.py check ${{ matrix.flavor }} --lua=lua5.1 --self-check

      - name: Confirm checked bytes are unchanged
        working-directory: QuestieDB
        run: sha256sum -c QuestieDB_${{ matrix.flavor }}.sha256

      - name: Hand verified TOC to packaging
        uses: actions/upload-artifact@v7
        with:
          name: release-toc-${{ matrix.flavor }}
          path: |
            QuestieDB/QuestieDB_${{ matrix.flavor }}.toc
            QuestieDB/QuestieDB_${{ matrix.flavor }}.sha256
          retention-days: 7
          if-no-files-found: error

  quality:
    name: Package verified artifacts
    needs: [preflight, shared, database]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: QuestieDB
          # Changelogs need stable tags and every commit since the previous release.
          fetch-depth: 0

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # These artifacts come only from this run's successful flavor pipelines. Packaging
      # never regenerates them, so the combined ZIP contains the exact checked TOCs.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-toc-*
          merge-multiple: true
          path: QuestieDB

      - name: Check every flavor handoff
        working-directory: QuestieDB
        run: |
          for flavor in Vanilla TBC Wrath Cata Mists; do
            sha256sum --strict -c "QuestieDB_${flavor}.sha256"
          done

      - name: Package and write the manifest
        working-directory: QuestieDB
        run: ./questiedb.sh package all

      - name: Upload the packaged release
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: QuestieDB/.out/dist/*
          retention-days: 7
          if-no-files-found: error

  differential:
    name: Compiler differential (${{ matrix.flavor }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists]
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }
      - uses: ./QuestieDB/.github/actions/checkout-questie

      # Questie's compiler oracle needs bit32. Keep this in its own job so the artifact job
      # can continue using the apt-installed interpreter used by the rest of the quality bar.
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v13.0.0
        with:
          luaVersion: "5.1"
      - name: Install luarocks
        uses: leafo/gh-actions-luarocks@v6.1.0
        with:
          luaRocksVersion: "3.13.0"
      - name: Install bit32
        run: luarocks install bit32 5.3.5.1-1

      - name: QuestieDB vs Questie's compiler
        working-directory: QuestieDB
        run: >-
          python3 tools/differential/compiler_diff.py ${{ matrix.flavor }}
          --questie=../Questie --lua=lua --self-check

  dry_run:
    name: Preview dry-run release
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    needs: [quality, differential]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: QuestieDB/.out/dist

      - name: Inspect ZIPs and preview the release description
        working-directory: QuestieDB
        run: >-
          python3 tools/distribution/preview.py .out/dist
          --commit "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the full dry-run report
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-preview
          path: QuestieDB/.out/dist/DRY_RUN.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    # Manual publication is opt-in; push-triggered previews keep their existing behavior.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    needs: [quality, differential]
    # Serialize mutations, not builds. Never cancel an upload midway through replacement.
    # Builds can finish out of commit order, so the publisher also rejects stale previews.
    concurrency:
      # Keep the pre-rename lock so older workflow runs cannot publish concurrently.
      group: questietdb-release-publication
      cancel-in-progress: false
      # Retain pending manual releases instead of letting a preview evict them.
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: QuestieDB/.out/dist

      - name: Publish
        working-directory: QuestieDB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.quality.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]

          # Use the dry-run verifier and its approved ZIP list before any GitHub mutation.
          # Capture first: process substitution would hide a verifier failure from set -e.
          ZIP_PATHS=$(python3 tools/distribution/release_artifacts.py .out/dist --commit "$GITHUB_SHA")
          mapfile -t ZIP_FILES <<< "$ZIP_PATHS"

          # Repeat the collision check under the publication lock: preflight can go stale.
          # shellcheck disable=SC2016
          STATE=$(gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f repo="${GITHUB_REPOSITORY#*/}" \
            -f tag="$TAG" -f ref="refs/tags/$TAG" -f query='
            query($owner:String!, $repo:String!, $tag:String!, $ref:String!) {
              repository(owner:$owner, name:$repo) { release(tagName:$tag) { databaseId } ref(qualifiedName:$ref) { name } }
            }' --jq '.data.repository')
          jq -e 'type == "object"' <<< "$STATE" > /dev/null
          if [[ "$QUESTIEDB_RELEASE" == true && "$RELEASE_OVERRIDE" != true ]] && \
             jq -e '.release != null or .ref != null' <<< "$STATE" > /dev/null; then
            echo "::error::$TAG already exists. Bump ## Version or explicitly enable override."
            exit 1
          fi
          RELEASE_ID=$(jq -r '.release.databaseId // empty' <<< "$STATE")
          HAS_TAG=$(jq -r '.ref != null' <<< "$STATE")
          if [[ -n "$RELEASE_ID" ]]; then
            IMMUTABLE=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.immutable // false')
            if [[ "$IMMUTABLE" == true ]]; then
              echo "::error::$TAG is immutable on GitHub; override cannot replace it."
              exit 1
            fi
          fi
          if [[ "$TAG" == preview && "$HAS_TAG" == true ]]; then
            CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$TAG" --jq '.sha')
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/compare/$CURRENT...$GITHUB_SHA" --jq '.status')
            case "$STATUS" in
              behind) echo "A newer preview is already published; skipping this build."; exit 0 ;;
              ahead|identical) ;;
              *) echo "::error::Preview history diverged. Resolve its tag before publishing."; exit 1 ;;
            esac
          fi

          TITLE="Unstable Pre-Release Development Build (master-branch)"
          PRERELEASE=true
          if [[ "$QUESTIEDB_RELEASE" == true ]]; then TITLE="QuestieDB ${TAG#v}"; PRERELEASE=false; fi
          if [[ -z "$RELEASE_ID" ]]; then
            # Let GitHub create a missing tag at the target commit when publishing the draft.
            # A separate ref creation followed by --verify-tag can race tag visibility.
            # Only first publication uses a draft, so a failed first upload stays unpublished.
            gh release create "$TAG" --target "$GITHUB_SHA" --draft \
              --title "$TITLE" --notes-file .out/dist/RELEASE_NOTES.md
          fi

          # Updates are intentionally non-atomic. Keep the old manifest until all ZIPs upload;
          # bootstrap rejects mixed downloads. Rerun after failure (full releases need override).
          gh release upload "$TAG" "${ZIP_FILES[@]}" \
            .out/dist/RELEASE_NOTES.md --clobber
          if [[ "$HAS_TAG" == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" --method PATCH -f sha="$GITHUB_SHA" -F force=true
          fi
          gh release upload "$TAG" .out/dist/release.json --clobber
          gh release edit "$TAG" --draft=false --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file .out/dist/RELEASE_NOTES.md --prerelease="$PRERELEASE" --latest="$QUESTIEDB_RELEASE"
