name: Release

# A manual run may also bump the Source TOC version first; the bump is committed to the
# default branch and every later job builds and publishes that commit.
# Default-branch builds replace one rolling preview. Manual full releases use vX.X.X from
# the committed Source TOC. Manual publication is opt-in; pushes publish preview automatically.
# The manifest identifies the exact producing commit.
#
# Publication is impossible on red. `publish` requires the artifact quality bar and
# unchanged legacy corrections.
# The write-enabled jobs run no build or test code: publication uploads only the
# artifacts handed through those gates, unmodified.
# GitHub publication uses the automatic GITHUB_TOKEN. Published stable releases are then
# uploaded to CurseForge with the CF_API_TOKEN secret (publish-curseforge.yml).

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 1.0.12). Bumps the Source TOC on the default branch before building. Requires --publish. Optional."
        type: string
        default: ""
      release:
        description: "--release-build: Build a stable version instead of a development build. Does not publish by itself."
        type: boolean
        default: false
      publish:
        description: "--publish: Publish the selected build to GitHub. Leave unchecked to preview without changing tags or releases."
        type: boolean
        default: false
      override:
        description: "--replace: Overwrite an existing stable release and move its tag. Requires --release-build and --publish."
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: 1700000000
  QUESTIEDB_RELEASE: ${{ inputs.release && 'true' || 'false' }}
  RELEASE_OVERRIDE: ${{ inputs.override && 'true' || 'false' }}
  DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && 'false' || 'true' }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate the request
        if: ${{ inputs.version != '' }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "ERROR: A version bump pushes a commit, so it requires --publish." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "ERROR: A version bump must run from the default branch." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: Invalid version: $VERSION. Use X.Y.Z without a v prefix." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Update the Source TOC, commit and push
        if: ${{ inputs.version != '' }}
        run: |
          sed -i -E "s/^(## Version:[[:space:]]*).*$/\1$VERSION/" QuestieDB.toc
          # Fail early unless the TOC still has exactly one canonical version.
          sudo apt-get update && sudo apt-get install -y lua5.1
          [[ "$(lua5.1 -e 'print(dofile("generator/version.lua").read("QuestieDB.toc"))')" == "$VERSION" ]]
          # A rerun after a failed release finds the bump already committed.
          if git diff --quiet QuestieDB.toc; then
            echo "QuestieDB.toc is already at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): bump version to $VERSION" QuestieDB.toc
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: Save the commit to build
        id: commit
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  legacy:
    name: Legacy corrections
    needs: [bump, preflight]
    permissions:
      contents: read
    uses: ./.github/workflows/legacy-corrections.yml
    with:
      ref: ${{ needs.bump.outputs.commit_sha }}

  preflight:
    name: Release preflight
    needs: bump
    runs-on: ubuntu-latest
    # Push access makes drafts visible. This job only reads GitHub state.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: QuestieDB
          ref: ${{ needs.bump.outputs.commit_sha }}
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Choose release and reject existing versions
        id: release
        working-directory: QuestieDB
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/distribution/release.py preflight

  shared:
    name: Shared checks
    needs: [bump, preflight]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: QuestieDB
          ref: ${{ needs.bump.outputs.commit_sha }}

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generator tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/validation/version.test.py
          python3 tools/validation/localization-inputs.test.py

      - name: Tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/cli/questiedb.test.py
          python3 tools/validation/test-scopes.test.py
          python3 tools/dbc/coordinates.test.py
          python3 tools/dbc/download.test.py
          python3 tools/dbc/rewrite.test.py
          python3 tools/dbc/convert.test.py
          python3 tools/dbc/support.test.py
          python3 tools/distribution/package.test.py
          python3 tools/distribution/bootstrap.test.py
          python3 tools/distribution/release_artifacts.test.py
          python3 tools/distribution/release.test.py
          python3 tools/distribution/forever.test.py
          python3 tools/distribution/curseforge.test.py

      - name: Fail on Source TOC drift
        working-directory: QuestieDB
        run: |
          lua5.1 generate.lua toc
          git diff --exit-code QuestieDB.toc

      - name: Shared unit tests
        working-directory: QuestieDB
        run: lua5.1 test.lua --shared

  database:
    name: Quality bar
    needs: [bump, preflight]
    uses: ./.github/workflows/database-checks.yml
    with:
      release: ${{ inputs.release == true }}
      ref: ${{ needs.bump.outputs.commit_sha }}

  quality:
    name: Package verified artifacts
    needs: [bump, preflight, shared, database, legacy]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: QuestieDB
          ref: ${{ needs.bump.outputs.commit_sha }}
          # Changelogs need stable tags and every commit since the previous release.
          fetch-depth: 0

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      # These artifacts come only from this run's successful database checks, whose
      # Determinism job matched them against every other Generation of their flavor.
      # Packaging never regenerates them, so the combined ZIP contains the exact checked TOCs.
      - uses: actions/download-artifact@v8
        with:
          pattern: database-toc-*
          merge-multiple: true
          path: QuestieDB

      - name: Check every flavor handoff
        working-directory: QuestieDB
        run: |
          for flavor in Vanilla TBC Wrath Cata Mists Forever; do
            sha256sum --strict -c "QuestieDB_${flavor}.sha256"
          done

      - name: Package and write the manifest
        working-directory: QuestieDB
        run: ./questiedb.sh package all

      - name: Upload the packaged release
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: QuestieDB/.out/dist/*
          retention-days: 7
          if-no-files-found: error

  dry_run:
    name: Preview dry-run release
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: ubuntu-latest
    needs: [bump, quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: QuestieDB
          ref: ${{ needs.bump.outputs.commit_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: QuestieDB/.out/dist

      - name: Inspect ZIPs and preview the release description
        working-directory: QuestieDB
        env:
          COMMIT_SHA: ${{ needs.bump.outputs.commit_sha }}
        run: >-
          python3 tools/distribution/preview.py .out/dist
          --commit "$COMMIT_SHA" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the full dry-run report
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run-preview
          path: QuestieDB/.out/dist/DRY_RUN.md
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish
    # Manual publication is opt-in; push-triggered previews keep their existing behavior.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    needs: [bump, quality]
    # Serialize mutations, not builds. Never cancel an upload midway through replacement.
    # Builds can finish out of commit order, so the publisher also rejects stale previews.
    concurrency:
      # Keep the pre-rename lock so older workflow runs cannot publish concurrently.
      group: questietdb-release-publication
      cancel-in-progress: false
      # Retain pending manual releases instead of letting a preview evict them.
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: QuestieDB
          ref: ${{ needs.bump.outputs.commit_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: QuestieDB/.out/dist

      - name: Publish
        working-directory: QuestieDB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.quality.outputs.tag }}
          COMMIT_SHA: ${{ needs.bump.outputs.commit_sha }}
        run: python3 tools/distribution/release.py publish

  curseforge:
    name: CurseForge
    if: inputs.release && inputs.publish
    needs: [quality, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-curseforge.yml
    with:
      tag: ${{ needs.quality.outputs.tag }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [bump, preflight, legacy, shared, database, quality, dry_run, publish, curseforge]
    if: failure()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Use the run URL when the event has no compare URL
        run: |
          jq --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '.compare //= $url' "$GITHUB_EVENT_PATH" > event.json
          mv event.json "$GITHUB_EVENT_PATH"

      - name: Send release failure to Discord
        uses: nebularg/actions-discord-webhook@v1.0.0
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
