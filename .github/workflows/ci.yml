name: CI

# Every commit produces a verified, downloadable database. The terminal `gates` job makes
# every matrix and unit result mandatory for branch protection.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Byte-reproducible artifacts: generation stamps X-BUILD-TIME from this rather than the wall
  # clock, so the same input produces the same bytes and a checksum means something.
  SOURCE_DATE_EPOCH: 1700000000

jobs:
  legacy:
    name: Legacy corrections
    permissions:
      contents: read
    uses: ./.github/workflows/legacy-corrections.yml

  test:
    name: Shared checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generator tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/validation/version.test.py
          python3 tools/validation/localization-inputs.test.py

      - name: Tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/cli/questiedb.test.py
          python3 tools/validation/test-scopes.test.py
          python3 tools/dbc/coordinates.test.py
          python3 tools/dbc/download.test.py
          python3 tools/dbc/rewrite.test.py
          python3 tools/dbc/convert.test.py
          python3 tools/dbc/support.test.py
          python3 tools/distribution/package.test.py
          python3 tools/distribution/bootstrap.test.py
          python3 tools/distribution/release_artifacts.test.py
          python3 tools/distribution/release.test.py
          python3 tools/distribution/forever.test.py

      - name: Fail on Source TOC drift
        working-directory: QuestieDB
        # Check the committed base TOC in this checkout. Flavor Generation in separate jobs
        # also refreshes it and would otherwise hide an uncommitted file-list change.
        run: |
          lua5.1 generate.lua toc
          git diff --exit-code QuestieDB.toc

      - name: Shared unit tests
        working-directory: QuestieDB
        run: lua5.1 test.lua --shared

  database:
    name: ${{ matrix.flavor }}
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists, Forever]
    uses: ./.github/workflows/database-checks.yml
    with:
      flavor: ${{ matrix.flavor }}

  package:
    name: Package (${{ matrix.flavor }})
    needs: database
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists, Forever]
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - uses: actions/download-artifact@v8
        with:
          name: database-toc-${{ matrix.flavor }}
          path: QuestieDB

      - name: Check verified artifact handoff
        working-directory: QuestieDB
        run: sha256sum --strict -c QuestieDB_${{ matrix.flavor }}.sha256

      - name: Package
        working-directory: QuestieDB
        run: ./questiedb.sh package ${{ matrix.flavor }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuestieDB-${{ matrix.flavor }}
          path: QuestieDB/.out/dist/*
          retention-days: 14

  gates:
    name: All gates
    runs-on: ubuntu-latest
    # Terminal aggregate: branch protection requires exactly this one status. `always()` keeps
    # it running when a dependency fails or is cancelled; the explicit checks then fail it, so
    # a skipped or cancelled gate can never read as green.
    needs: [test, database, package, legacy]
    if: always()
    steps:
      - name: Fail unless every gate succeeded
        run: |
          ok=1
          [ "${{ needs.test.result }}" = "success" ] || { echo "::error::Shared checks: ${{ needs.test.result }}"; ok=0; }
          [ "${{ needs.database.result }}" = "success" ] || { echo "::error::Database matrix: ${{ needs.database.result }}"; ok=0; }
          [ "${{ needs.package.result }}" = "success" ] || { echo "::error::Packaging: ${{ needs.package.result }}"; ok=0; }
          [ "${{ needs.legacy.result }}" = "success" ] || { echo "::error::Legacy corrections: ${{ needs.legacy.result }}"; ok=0; }
          [ "$ok" = "1" ]
