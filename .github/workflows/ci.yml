name: CI

# Every commit produces a verified, downloadable database. The terminal `gates` job makes
# every matrix and unit result mandatory for branch protection.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Byte-reproducible artifacts: generation stamps X-BUILD-TIME from this rather than the wall
  # clock, so the same input produces the same bytes and a checksum means something.
  SOURCE_DATE_EPOCH: 1700000000

jobs:
  test:
    name: Shared checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generator tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/validation/version.test.py
          python3 tools/validation/localization-inputs.test.py

      - name: Tooling tests (offline)
        working-directory: QuestieDB
        run: |
          python3 tools/cli/questiedb.test.py
          python3 tools/validation/test-scopes.test.py
          python3 tools/distribution/package.test.py
          python3 tools/distribution/bootstrap.test.py
          python3 tools/distribution/release_artifacts.test.py
          python3 tools/distribution/release.test.py

      - name: Fail on Source TOC drift
        working-directory: QuestieDB
        # Check the committed base TOC in this checkout. Flavor Generation in separate jobs
        # also refreshes it and would otherwise hide an uncommitted file-list change.
        run: |
          lua5.1 generate.lua toc
          git diff --exit-code QuestieDB.toc

      - name: Shared unit tests
        working-directory: QuestieDB
        run: lua5.1 test.lua --shared

  database:
    name: ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists]
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generate
        working-directory: QuestieDB
        run: lua5.1 generate.lua ${{ matrix.flavor }}

      - name: Determinism
        working-directory: QuestieDB
        # Run this before any reader. Every later gate therefore approves the exact
        # second-generation bytes whose hash matched the first Generation.
        run: |
          sha256sum QuestieDB_${{ matrix.flavor }}.toc > first.sha
          lua5.1 generate.lua ${{ matrix.flavor }} --quiet
          sha256sum -c first.sha

      - name: Flavor unit tests
        working-directory: QuestieDB
        run: lua5.1 test.lua --flavor=${{ matrix.flavor }}

      - name: Reconstruct artifact
        working-directory: QuestieDB
        # Preserve the smallest/largest byte-exact coverage without generating them again
        # in the shared job. Release reconstructs all five flavors.
        if: matrix.flavor == 'Vanilla' || matrix.flavor == 'Mists'
        run: lua5.1 reconstruct.lua ${{ matrix.flavor }}

      - name: Round-trip verification
        working-directory: QuestieDB
        run: lua5.1 verify.lua ${{ matrix.flavor }}

      - name: Round-trip verification under freezing
        working-directory: QuestieDB
        # Opt-in because the pure-Lua freeze substitute costs about 2x wall clock. The smallest
        # and largest flavors keep the ownership guard present in CI without paying 2x on every
        # matrix leg.
        if: matrix.flavor == 'Vanilla' || matrix.flavor == 'Mists'
        run: lua5.1 verify.lua ${{ matrix.flavor }} --freeze

      - name: Source/baked equivalence
        working-directory: QuestieDB
        # The load-bearing test in the system. Two permanent read modes mean it never retires.
        run: lua5.1 equivalence.lua ${{ matrix.flavor }}

      - name: Data validators
        working-directory: QuestieDB
        run: lua5.1 validators/run.lua ${{ matrix.flavor }}

      - name: Upload validator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validator-diagnostics-${{ matrix.flavor }}
          path: QuestieDB/.out/validators/
          if-no-files-found: ignore

      - name: Package
        working-directory: QuestieDB
        run: ./questiedb.sh package ${{ matrix.flavor }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuestieDB-${{ matrix.flavor }}
          path: QuestieDB/.out/dist/*
          retention-days: 14

  gates:
    name: All gates
    runs-on: ubuntu-latest
    # Terminal aggregate: branch protection requires exactly this one status. `always()` keeps
    # it running when a dependency fails or is cancelled; the explicit checks then fail it, so
    # a skipped or cancelled gate can never read as green.
    needs: [test, database]
    if: always()
    steps:
      - name: Fail unless every gate succeeded
        run: |
          ok=1
          [ "${{ needs.test.result }}" = "success" ] || { echo "::error::Shared checks: ${{ needs.test.result }}"; ok=0; }
          [ "${{ needs.database.result }}" = "success" ] || { echo "::error::Database matrix: ${{ needs.database.result }}"; ok=0; }
          [ "$ok" = "1" ]
