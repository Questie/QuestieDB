name: Bump version
run-name: "Bump to v${{ inputs.version }} on ${{ github.ref_name }}"

# Unlike Questie, this does not tag: release.py creates the tag when it publishes.
# The bump runs before the release checks because the version is baked into every TOC.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example 1.0.13)
        type: string
        required: true
      dry_run:
        description: (--dry_run) Do not commit/push, just log git diff
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Version without the v prefix (for example 1.0.13)
        type: string
        required: true
      dry_run:
        description: (--dry_run) Do not commit/push, just log git diff
        type: boolean
        default: false
    outputs:
      commit_sha:
        description: Bumped commit, or the current commit for a dry run/empty version
        value: ${{ jobs.sha.outputs.commit_sha }}

permissions:
  contents: read

concurrency:
  group: versionbump-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bump:
    name: Update Source TOC and commit
    if: ${{ inputs.version != '' }}
    runs-on: ubuntu-latest
    environment: version-bump
    env:
      VERSION: ${{ inputs.version }}
      TARGET_BRANCH: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      commit_sha: ${{ steps.commitsha.outputs.commit_sha }}
    steps:
      - name: Validate branch and version number
        run: |
          if [[ "$TARGET_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "ERROR: Versions can only be bumped on $DEFAULT_BRANCH, not $TARGET_BRANCH." >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "ERROR: Invalid version number: $VERSION" >&2
            echo "Enter a version such as 1.0.13, without a v prefix." >&2
            exit 1
          fi
      # Environment approval is required before this job receives the private key.
      # Limit each short-lived token to this repository and Contents write access.
      - name: Create app token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.VERSION_BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout selected commit
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Update versions
        run: |
          sed -i -E "s/^(## Version:[[:space:]]*).*$/\1$VERSION/" QuestieDB.toc
          # Fail early unless the TOC still has exactly one canonical version.
          [[ "$(lua5.1 -e 'print(dofile("generator/version.lua").read("QuestieDB.toc"))')" == "$VERSION" ]]

      - name: Log git diff
        if: ${{ inputs.dry_run }}
        run: git diff

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          AUTHOR_LOGIN: ${{ github.actor }}
          AUTHOR_ID: ${{ github.actor_id }}
        run: |
          # A new dispatch after a failed release finds the bump already committed.
          if git diff --quiet QuestieDB.toc; then
            echo "QuestieDB.toc is already at $VERSION."
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # Credit the original initiator; the app remains the authenticated committer.
          # [skip ci] stops the push from also starting a preview release beside this run.
          git commit --author "$AUTHOR_LOGIN <$AUTHOR_ID+$AUTHOR_LOGIN@users.noreply.github.com>" \
            -m "chore(release): bump version to $VERSION [skip ci]" QuestieDB.toc

          # Do not force pushes or bypass branch protection.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Summarize
        if: ${{ !inputs.dry_run }}
        run: |
          commit=$(git rev-parse HEAD)
          {
            printf 'QuestieDB.toc is at %s on branch %s.\n\n' "$VERSION" "$TARGET_BRANCH"
            printf 'Release commit: %s.\n\n' "$commit"
            printf 'No tag, GitHub release or platform upload was created.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save commit sha for later
        id: commitsha
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  sha:
    name: Output git sha to other workflows
    runs-on: ubuntu-latest
    needs: bump
    if: ${{ always() }} # run even for empty version string
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    env:
      COMMIT_SHA: ${{ needs.bump.outputs.commit_sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Save commit sha
        id: commit
        run: echo "commit_sha=${COMMIT_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
