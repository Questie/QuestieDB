name: Database checks

# Called by CI and Release. One job per flavor and heavy check, each generating its own TOC,
# so the slowest flavor costs one Generation plus its slowest check rather than all of them
# in series. Determinism then requires every Generation of a flavor to be byte-identical: that
# is the reproducibility gate, and it proves each check approved the bytes that get packaged.
on:
  workflow_call:
    inputs:
      release:
        description: Generate a stable version instead of a development version.
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Caller workflow env is not inherited by reusable workflows.
  SOURCE_DATE_EPOCH: 1700000000
  QUESTIEDB_RELEASE: ${{ inputs.release && 'true' || 'false' }}

jobs:
  check:
    name: ${{ matrix.flavor }} (${{ matrix.check }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists, Forever]
        # Equivalence is the load-bearing test: two permanent read modes mean it never retires.
        check: [verify, equivalence, reconstruct]
    env:
      FLAVOR: ${{ matrix.flavor }}
      CHECK: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@v7
        with: { path: QuestieDB }

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Generate
        working-directory: QuestieDB
        env:
          # Equivalence, the shortest job, generates with the bundled interpreter that
          # ./questiedb.sh prefers locally, so Determinism also proves it matches lua5.1's bytes.
          GENERATOR: ${{ matrix.check == 'equivalence' && './tools/lua-binary/linux-x64/lua' || 'lua5.1' }}
        run: |
          "$GENERATOR" generate.lua "$FLAVOR" --no-base-toc
          tocs=("QuestieDB_${FLAVOR}.toc")
          # Forever ships a byte-identical Camelot alias, not a separate flavor.
          if [[ "$FLAVOR" == Forever ]]; then
            cmp QuestieDB_Forever.toc QuestieDB_Camelot.toc
            tocs+=(QuestieDB_Camelot.toc)
          fi
          sha256sum "${tocs[@]}" > "QuestieDB_${FLAVOR}.sha256"

      - name: Record generated bytes for Determinism
        uses: actions/upload-artifact@v7
        with:
          name: database-sha-${{ matrix.flavor }}-${{ matrix.check }}
          path: QuestieDB/QuestieDB_${{ matrix.flavor }}.sha256
          # Match the TOC handoff, so re-running failed jobs still finds every leg's record.
          retention-days: 7
          if-no-files-found: error

      # The short checks ride with verification instead of provisioning more runners.
      - name: Flavor unit tests
        if: matrix.check == 'verify'
        working-directory: QuestieDB
        run: lua5.1 test.lua --flavor="$FLAVOR"

      - name: Run ${{ matrix.check }}
        working-directory: QuestieDB
        run: lua5.1 "$CHECK.lua" "$FLAVOR"

      - name: Data validators
        if: matrix.check == 'verify'
        working-directory: QuestieDB
        run: lua5.1 validators/run.lua "$FLAVOR"

      - name: Upload validator diagnostics
        if: always() && matrix.check == 'verify'
        uses: actions/upload-artifact@v7
        with:
          name: validator-diagnostics-${{ matrix.flavor }}
          path: QuestieDB/.out/validators/
          if-no-files-found: ignore

      - name: Confirm checked bytes are the recorded bytes
        if: matrix.check == 'verify'
        working-directory: QuestieDB
        run: sha256sum --strict -c "QuestieDB_${FLAVOR}.sha256"

      # The caller packages only after every job here, Determinism included, has passed.
      - name: Hand checked TOCs to packaging
        if: matrix.check == 'verify'
        uses: actions/upload-artifact@v7
        with:
          name: database-toc-${{ matrix.flavor }}
          path: |
            QuestieDB/QuestieDB_*.toc
            QuestieDB/QuestieDB_${{ matrix.flavor }}.sha256
          retention-days: 7
          if-no-files-found: error

  determinism:
    name: Determinism
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: database-sha-*
          path: sha

      - name: Require identical bytes from every Generation of a flavor
        run: |
          ok=1
          for dir in sha/database-sha-*; do
            name=${dir#sha/database-sha-}
            flavor=${name%%-*}
            if ! cmp -s "sha/database-sha-$flavor-verify/QuestieDB_$flavor.sha256" "$dir/QuestieDB_$flavor.sha256"; then
              echo "::error::$flavor: the ${name#*-} job generated different bytes than verify"
              ok=0
            fi
          done
          # Six flavors × three checks, as in the check matrix; a partial set must not pass.
          found=$(find sha -mindepth 1 -maxdepth 1 -type d | wc -l)
          if [ "$found" != 18 ]; then
            echo "::error::found $found recorded Generations, expected 18"
            ok=0
          fi
          cat sha/database-sha-*-verify/*.sha256
          [ "$ok" = 1 ]
